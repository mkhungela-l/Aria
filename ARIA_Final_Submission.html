blem:`Platform unnamed. Developer cannot start this work.`,fix:`Confirm: SolarWinds Orion via REST or Datadog via webhook. Lock in ADR before sprint.`,state:null,comments:[]}],pp=[{id:`US-001`,title:`Client views infrastructure status dashboard`,role:`Client Viewer`,goal:`see real-time status of my assets on one screen`,benefit:`I can spot incidents before they affect my business`,given:`I am logged in as a Client Viewer for tenant ACME`,when:`I open the portal home screen`,then:`I see a dashboard with environment health, incident count, and SLA window — loads within 1.5s`,ac:[`Dashboard renders P95 ≤ 1.5s on 3G`,`Only ACME assets visible (multi-tenant isolation)`,`Status colours meet WCAG AA contrast`],points:5,status:`Refined`,comments:[],starred:!1},{id:`US-002`,title:`Client logs a support ticket from mobile`,role:`Client Viewer`,goal:`report a problem from my phone in under one minute`,benefit:`I can raise urgent issues even when away from my desk`,given:`I am on a mobile device with the portal open`,when:`I tap New Ticket, choose a category, describe the issue, and submit`,then:`Ticket created, reference number issued, SLA timer starts within 800ms`,ac:[`Form requires ≤ 4 fields`,`Submit responds ≤ 800ms P95`,`Push + email notification within 30s`],points:8,status:`Ready for sprint`,comments:[],starred:!1},{id:`US-003`,title:`Admin manages portal access for their organisation`,role:`Client Admin`,goal:`invite users and assign roles without raising a ticket with iOCO`,benefit:`I control access independently and immediately`,given:`I am authenticated as Client Admin for tenant ACME`,when:`I invite a new user and assign the Viewer role`,then:`Invite email sent with a one-time link expiring in 24 hours`,ac:[`RBAC enforced server-side`,`Invite link is single-use`,`Audit log entry written within 1s`],points:5,status:`Refined`,comments:[],starred:!1},{id:`US-004`,title:`Admin receives monthly service report securely`,role:`Client Admin`,goal:`receive monthly report w
